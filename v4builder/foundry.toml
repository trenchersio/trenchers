[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
auto_detect_remappings = false
fs_permissions = [{ access = "read", path = "./lib/universal-router/out" }]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 32
depth = 24
fail_on_revert = true
[lint]
lint_on_build = false
